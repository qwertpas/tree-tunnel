<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f1">
  <title>Tree Tunnel</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main id="map" aria-label="Tree tunnel map"></main>
  <form id="controls" autocomplete="off">
    <div class="search-row">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Street" aria-label="Find a street" list="streets">
      <datalist id="streets"></datalist>
    </div>
    <div class="score-row">
      <label for="score">Coverage</label>
      <input id="score" type="range" min="0" max="100" value="40" step="5">
      <output id="score-value" for="score">≥ 40%</output>
    </div>
    <div class="layers">
      <label><input id="canopy" type="checkbox"><span>Canopy 2022</span></label>
      <label><input id="photos" type="checkbox" checked><span>Photos</span></label>
      <label><input id="aerial" type="checkbox"><span>Aerial</span></label>
    </div>
    <div id="status" role="status" aria-live="polite">Loading…</div>
  </form>
</body>
</html>
